[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contestflow-local"
version = "0.2.0a1"
description = "Team-led, agent-oriented modeling workflows and reproducible local tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Security floors on plotting transitive dependencies also apply to existing environments.
science = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pillow>=12.3.0", "fonttools>=4.66.0"]
documents = ["pypdf>=6.19.0", "pypandoc_binary>=1.17"]
dev = ["pytest>=9.1.1", "ruff>=0.16.9", "build>=1.6.1", "pygments>=2.21.0"]
audit = ["pip-audit>=2.10.1"]

[project.urls]
Repository = "https://github.com/whjwjx/ContestFlow"
Issues = "https://github.com/whjwjx/ContestFlow/issues"

[project.scripts]
contestflow = "contestflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contestflow = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
